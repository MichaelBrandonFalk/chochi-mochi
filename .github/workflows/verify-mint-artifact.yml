name: Verify an existing Mint package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable source tag for the package
        required: true
        type: string
      build_run:
        description: Desktop build run containing desktop-linux
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify-mint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate release references
        env:
          TAG: ${{ inputs.release_tag }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          [[ "$TAG" =~ ^v3\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - name: Match package run to source tag
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          GH_REPO: ${{ github.repository }}
        run: |
          source_sha=$(git rev-parse HEAD)
          build_sha=$(gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" --jq .head_sha)
          test "$source_sha" = "$build_sha"
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: packages
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Install the Mint 22 base package
        run: |
          mkdir /tmp/chochi-empty-sources
          cat > /tmp/chochi-ubuntu.list <<'SOURCES'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe restricted multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe restricted multiverse
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe restricted multiverse
          SOURCES
          options=(-o Dir::Etc::sourcelist=/tmp/chochi-ubuntu.list -o Dir::Etc::sourceparts=/tmp/chochi-empty-sources -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${options[@]}" install -y ./packages/*.deb
      - name: Check installed offline game on the Mint 22 Ubuntu base
        run: xvfb-run -a chochi-mochi --self-test
